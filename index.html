<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>コツコツ貯金</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root {
  --bg: #fff4ef;
  --card: #ffffff;
  --ink: #4b3238;
  --muted: #9a7f86;
  --line: #f3d9d4;
  --accent: #ef7f93;
  --accent-deep: #d95f77;
  --accent-ink: #ffffff;
  --soft: #fde6e3;
  --pig: #f8a5b4;
  --pig-dark: #e8768c;
  --danger: #c4493c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #2a1d21;
    --card: #36262b;
    --ink: #fbeaec;
    --muted: #c4a3aa;
    --line: #4d363d;
    --accent: #f59aab;
    --accent-deep: #d9728a;
    --accent-ink: #3d1620;
    --soft: #443037;
    --pig: #f5a3b3;
    --pig-dark: #e0728a;
    --danger: #ff9a8a;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  color: var(--ink);
  background: var(--bg);
  min-height: 100vh;
  padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
  font-variant-numeric: tabular-nums;
}
.hidden { display: none !important; }
main { max-width: 460px; margin: 0 auto; padding: 26px 18px 64px; }
header { text-align: center; margin-bottom: 22px; }
header h1 { display: inline-block; margin: 0; padding: 8px 22px; font-size: 16px; font-weight: 900; color: var(--accent-ink); background: var(--accent); border-radius: 999px; letter-spacing: .06em; }
header span { display: block; margin-top: 8px; font-size: 12px; color: var(--muted); }

section { margin-bottom: 20px; background: var(--card); border-radius: 28px; padding: 22px; box-shadow: 0 4px 0 var(--line); }
h2 { margin: 0 0 14px; font-size: 15px; font-weight: 900; display: flex; justify-content: space-between; align-items: baseline; }
h2 span { font-size: 12px; font-weight: 500; color: var(--muted); background: var(--soft); padding: 3px 10px; border-radius: 999px; }
.hint { margin: -6px 0 14px; color: var(--muted); font-size: 13px; line-height: 1.7; }

.mascot { display: block; width: 150px; height: auto; margin: 0 auto 6px; overflow: visible; }
.mascot .body { fill: var(--pig); }
.mascot .dark { fill: var(--pig-dark); }
.mascot .eye { fill: #4b3238; }
.mascot .coin { fill: #ffd76a; stroke: #e9b23a; stroke-width: 2; }
.mascot .bob { animation: bob 3s ease-in-out infinite; transform-origin: 80px 90px; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }

.hero { text-align: center; }
.label { margin: 0; color: var(--muted); font-size: 13px; }
.big { margin: 2px 0 0; font-size: 62px; font-weight: 900; line-height: 1.1; letter-spacing: -.02em; color: var(--accent-deep); }
.big small { font-size: 20px; font-weight: 700; margin-left: 4px; }
.cheer { margin: 12px auto 0; width: fit-content; max-width: 100%; padding: 7px 16px; border-radius: 999px; background: var(--soft); color: var(--accent-deep); font-size: 14px; font-weight: 700; }

.track { position: relative; height: 14px; margin: 38px 6px 12px; background: var(--soft); border-radius: 999px; }
.fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--accent); border-radius: 999px; transition: width 1s cubic-bezier(.2, .8, .2, 1); }
.tick { position: absolute; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--card); border: 3px solid var(--line); }
.tick i { position: absolute; top: -24px; left: 50%; transform: translateX(-50%); font-style: normal; font-size: 11px; color: var(--muted); }
.tick.on { background: var(--card); border-color: var(--accent-deep); }
.tick.on i { color: var(--accent-deep); font-weight: 700; }
.ends { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); padding: 0 4px; }
.ends b { color: var(--ink); font-weight: 900; font-size: 15px; }

.coin {
  display: block;
  width: 100%;
  margin-top: 24px;
  padding: 18px 12px;
  font: inherit;
  font-size: 18px;
  font-weight: 900;
  color: var(--accent-ink);
  background: var(--accent);
  border: 0;
  border-radius: 999px;
  box-shadow: 0 6px 0 var(--accent-deep);
  cursor: pointer;
  transition: transform .08s, box-shadow .08s;
}
.coin:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--accent-deep); }
.coin:disabled { background: var(--soft); color: var(--muted); box-shadow: 0 6px 0 var(--line); cursor: default; transform: none; }
.coin:focus-visible, .addbtn:focus-visible, .del:focus-visible, .logout:focus-visible, .addrow input:focus-visible { outline: 3px solid var(--accent-deep); outline-offset: 3px; }
.note { margin: 18px 0 0; text-align: center; color: var(--muted); font-size: 13px; min-height: 20px; }
.error { color: var(--danger); margin: 12px 0 0; min-height: 20px; font-size: 13px; }
.ok { color: var(--accent-deep); margin: 12px 0 0; min-height: 20px; font-size: 13px; font-weight: 700; }

.grid { display: grid; grid-template-columns: repeat(15, 1fr); gap: 5px; }
.cell { aspect-ratio: 1; border-radius: 50%; background: var(--soft); }
.cell.on { background: radial-gradient(circle at 35% 30%, #ffd0d8, var(--accent)); }
.cell.new { animation: pop .6s cubic-bezier(.3, 1.8, .5, 1); }
@keyframes pop { 0% { transform: scale(0); } 100% { transform: scale(1); } }

.addrow { display: flex; gap: 10px; }
.addrow input {
  flex: 1;
  min-width: 0;
  font: inherit;
  font-size: 16px;
  color: var(--ink);
  background: var(--soft);
  border: 2px solid var(--line);
  border-radius: 18px;
  padding: 11px 14px;
  color-scheme: light dark;
}
.addbtn {
  flex: none;
  font: inherit;
  font-size: 15px;
  font-weight: 900;
  color: var(--accent-ink);
  background: var(--accent);
  border: 0;
  border-radius: 999px;
  box-shadow: 0 4px 0 var(--accent-deep);
  padding: 0 22px;
  cursor: pointer;
}
.addbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--accent-deep); }
.addbtn:disabled { background: var(--soft); color: var(--muted); box-shadow: 0 4px 0 var(--line); cursor: default; transform: none; }

.list { list-style: none; margin: 0; padding: 0; }
.list.spaced { margin-top: 16px; }
.list li { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 2px dotted var(--line); }
.list li:first-child { border-top: 0; padding-top: 0; }
.list .txt { flex: 1; min-width: 0; }
.list .when { font-weight: 700; font-size: 14px; }
.list .who { color: var(--muted); font-size: 12px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.empty { text-align: center; color: var(--muted); padding: 20px 8px !important; justify-content: center; font-size: 13px; }
.del {
  flex: none;
  font: inherit;
  font-size: 13px;
  font-weight: 700;
  color: var(--danger);
  background: transparent;
  border: 2px solid var(--danger);
  border-radius: 999px;
  padding: 6px 14px;
  cursor: pointer;
}
.del.yes { color: var(--accent-deep); border-color: var(--accent-deep); }
.del:disabled { opacity: .4; cursor: default; }
.btns { flex: none; display: flex; flex-direction: column; gap: 6px; }
.badge { flex: none; font-size: 12px; font-weight: 700; padding: 5px 12px; border-radius: 999px; }
.badge.pending { background: var(--soft); color: var(--muted); }
.badge.approved { background: var(--accent); color: var(--accent-ink); }
.badge.rejected { border: 2px solid var(--danger); color: var(--danger); }

.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px; }
.stat { background: var(--card); border-radius: 24px; box-shadow: 0 4px 0 var(--line); padding: 16px 14px; text-align: center; }
.stat p { margin: 0; color: var(--muted); font-size: 12px; }
.stat strong { display: block; margin-top: 4px; font-size: 26px; font-weight: 900; color: var(--accent-deep); }
.stat strong small { font-size: 13px; font-weight: 700; margin-left: 3px; }

.login { text-align: center; }
.login h2 { display: block; font-size: 24px; line-height: 1.4; margin: 6px 0 10px; }
.login p { color: var(--muted); line-height: 1.8; margin: 0 0 22px; font-size: 14px; }
#gbtn { display: flex; justify-content: center; }
.loading { text-align: center; }
.loading p { margin: 0 0 16px; color: var(--accent-deep); font-weight: 700; font-size: 15px; }
.loadbar { height: 12px; width: 70%; margin: 0 auto; background: var(--soft); border-radius: 999px; overflow: hidden; }
.loadbar i { display: block; height: 100%; width: 35%; background: var(--accent); border-radius: 999px; animation: slide 1.2s ease-in-out infinite; }
@keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }

.logout {
  display: block;
  margin: 8px auto 0;
  padding: 12px 30px;
  font: inherit;
  font-size: 14px;
  font-weight: 900;
  color: var(--accent-deep);
  background: var(--card);
  border: 2px solid var(--accent);
  border-radius: 999px;
  box-shadow: 0 4px 0 var(--accent);
  cursor: pointer;
}
.logout:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--accent); }
@media (prefers-reduced-motion: reduce) {
  .fill { transition: none; }
  .cell.new, .loadbar i, .mascot .bob { animation: none; }
}
</style>
</head>
<body>
<main>
  <header><h1>コツコツ貯金</h1><span id="tag"></span></header>

  <section id="login" class="login hidden">
    <svg class="mascot" viewBox="0 0 160 120" aria-hidden="true">
      <ellipse cx="80" cy="112" rx="52" ry="5" fill="#000" opacity=".06"/>
      <g class="bob">
        <rect class="dark" x="42" y="82" width="18" height="24" rx="9"/>
        <rect class="dark" x="100" y="82" width="18" height="24" rx="9"/>
        <path class="dark" d="M30 66 q-14 -2 -10 -14 q2 8 12 6" fill="none" stroke="var(--pig-dark)" stroke-width="5" stroke-linecap="round"/>
        <path class="dark" d="M52 34 L58 12 L76 28 Z"/>
        <path class="dark" d="M100 28 L118 12 L124 36 Z"/>
        <ellipse class="body" cx="80" cy="66" rx="54" ry="40"/>
        <rect x="64" y="30" width="32" height="6" rx="3" fill="var(--pig-dark)"/>
        <ellipse class="dark" cx="132" cy="70" rx="14" ry="11"/>
        <ellipse cx="128" cy="70" rx="2.5" ry="3.5" fill="var(--pig)"/>
        <ellipse cx="137" cy="70" rx="2.5" ry="3.5" fill="var(--pig)"/>
        <circle class="eye" cx="112" cy="54" r="5"/>
        <circle cx="114" cy="52" r="1.6" fill="#fff"/>
        <circle cx="106" cy="70" r="7" fill="#ff6f8f" opacity=".3"/>
      </g>
    </svg>
    <h2>毎日100円、<br>コツコツ貯めよう。</h2>
    <p>Googleアカウントでログインしてください。</p>
    <div id="gbtn"></div>
    <div id="loginError" class="error"></div>
  </section>

  <section id="loading" class="loading hidden">
    <p>読み込み中</p>
    <div class="loadbar"><i></i></div>
  </section>

  <div id="user" class="hidden">
    <section class="hero">
      <svg class="mascot" viewBox="0 0 160 120" aria-hidden="true">
      <ellipse cx="80" cy="112" rx="52" ry="5" fill="#000" opacity=".06"/>
      <g class="bob">
        <rect class="dark" x="42" y="82" width="18" height="24" rx="9"/>
        <rect class="dark" x="100" y="82" width="18" height="24" rx="9"/>
        <path class="dark" d="M30 66 q-14 -2 -10 -14 q2 8 12 6" fill="none" stroke="var(--pig-dark)" stroke-width="5" stroke-linecap="round"/>
        <path class="dark" d="M52 34 L58 12 L76 28 Z"/>
        <path class="dark" d="M100 28 L118 12 L124 36 Z"/>
        <ellipse class="body" cx="80" cy="66" rx="54" ry="40"/>
        <rect x="64" y="30" width="32" height="6" rx="3" fill="var(--pig-dark)"/>
        <ellipse class="dark" cx="132" cy="70" rx="14" ry="11"/>
        <ellipse cx="128" cy="70" rx="2.5" ry="3.5" fill="var(--pig)"/>
        <ellipse cx="137" cy="70" rx="2.5" ry="3.5" fill="var(--pig)"/>
        <circle class="eye" cx="112" cy="54" r="5"/>
        <circle cx="114" cy="52" r="1.6" fill="#fff"/>
        <circle cx="106" cy="70" r="7" fill="#ff6f8f" opacity=".3"/>
      </g>
    </svg>
      <p class="label">貯めた金額</p>
      <p class="big"><span id="total">0</span><small>円</small></p>
      <p class="cheer" id="cheer"></p>
      <div class="track">
        <div class="fill" id="bar"></div>
        <span class="tick" style="left:25%"><i>25%</i></span>
        <span class="tick" style="left:50%"><i>50%</i></span>
        <span class="tick" style="left:75%"><i>75%</i></span>
        <span class="tick" style="left:100%"><i>100%</i></span>
      </div>
      <div class="ends">
        <span>目標 <b id="goal">30,000</b>円</span>
        <span>残り <b id="remaining">30,000</b>円</span>
      </div>
      <button id="saveBtn" class="coin" type="button">今日の100円を貯金する</button>
      <p id="note" class="note"></p>
      <p id="error" class="error"></p>
    </section>

    <section>
      <h2>記録 <span id="stampCount">0 / 300</span></h2>
      <div class="grid" id="grid"></div>
    </section>

    <section>
      <h2>別の日の貯金をリクエスト</h2>
      <p class="hint">今日以外の日に貯金したときは、日時を選んで送信してください。管理者が確認します。</p>
      <div class="addrow">
        <input type="datetime-local" id="reqAt" aria-label="リクエストする日時">
        <button id="reqBtn" class="addbtn" type="button">送信</button>
      </div>
      <p id="reqMsg" class="error"></p>
      <ul id="reqList" class="list spaced"></ul>
    </section>
  </div>

  <div id="admin" class="hidden">
    <div class="stats">
      <div class="stat"><p>貯まった金額</p><strong><span id="aTotal">0</span><small>円</small></strong></div>
      <div class="stat"><p>目標まで</p><strong><span id="aRemaining">0</span><small>円</small></strong></div>
    </div>

    <section>
      <h2>承認待ち <span id="pendCount"></span></h2>
      <ul id="pending" class="list"></ul>
      <p id="pendMsg" class="error"></p>
    </section>

    <section>
      <h2>日時を指定して追加</h2>
      <div class="addrow">
        <input type="datetime-local" id="addAt" aria-label="追加する日時">
        <button id="addBtn" class="addbtn" type="button">追加</button>
      </div>
      <p id="addMsg" class="error"></p>
    </section>

    <section>
      <h2>貯金の記録 <span id="aCount"></span></h2>
      <ul id="records" class="list"></ul>
      <p id="adminError" class="error"></p>
    </section>
  </div>

  <button id="logout" class="logout hidden" type="button">ログアウト</button>
</main>

<script>
const API_BASE = "https://kotsukotsu-chokin.user-x45.workers.dev";
const CLIENT_ID = "51271346959-al6a6sprfiji96230nk3ehtm6f02bnhn.apps.googleusercontent.com";

const $ = (id) => document.getElementById(id);
const yen = (n) => Number(n).toLocaleString("ja-JP");
const TOKEN_KEY = "idToken";
const readToken = () => { try { return localStorage.getItem(TOKEN_KEY) || ""; } catch (e) { return ""; } };
const writeToken = (v) => { try { if (v) localStorage.setItem(TOKEN_KEY, v); else localStorage.removeItem(TOKEN_KEY); } catch (e) {} };
let token = readToken();
let freshToken = false;
let refreshing = false;
let shownTotal = 0;
let shownCount = 0;

const fmt = new Intl.DateTimeFormat("ja-JP", {
  timeZone: "Asia/Tokyo",
  year: "numeric", month: "numeric", day: "numeric",
  hour: "2-digit", minute: "2-digit", hour12: false
});

const grid = $("grid");
for (let i = 0; i < 300; i++) {
  const c = document.createElement("div");
  c.className = "cell";
  grid.appendChild(c);
}

function show(name) {
  ["login", "loading", "user", "admin"].forEach((s) => $(s).classList.toggle("hidden", s !== name));
  $("logout").classList.toggle("hidden", name === "login" || name === "loading");
  $("tag").textContent = name === "admin" ? "管理者" : "";
}

async function api(path, options = {}) {
  const res = await fetch(API_BASE + path, {
    ...options,
    headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" }
  });
  let body = {};
  try { body = await res.json(); } catch (e) {}
  return { status: res.status, body };
}

function showLogin(message, keepAuto) {
  token = "";
  refreshing = false;
  writeToken("");
  show("login");
  $("loginError").textContent = message || "";
  if (!keepAuto && window.google && google.accounts && google.accounts.id) {
    google.accounts.id.disableAutoSelect();
  }
}

function reauth() {
  const message = "ログインの有効期限が切れました。もう一度ログインしてください。";
  if (freshToken || !window.google || !google.accounts || !google.accounts.id) {
    freshToken = false;
    showLogin(message, true);
    return;
  }
  token = "";
  writeToken("");
  refreshing = true;
  show("loading");
  const giveUp = () => { if (refreshing) showLogin(message, true); };
  setTimeout(giveUp, 8000);
  google.accounts.id.prompt((n) => {
    if (!refreshing) return;
    const reason = n.getDismissedReason && n.getDismissedReason();
    if (reason === "credential_returned") return;
    if ((n.isNotDisplayed && n.isNotDisplayed()) || (n.isSkippedMoment && n.isSkippedMoment()) || (n.isDismissedMoment && n.isDismissedMoment())) giveUp();
  });
}

function countUp(el, from, to) {
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce || from === to) { el.textContent = yen(to); return; }
  const start = performance.now();
  const dur = 900;
  const step = (now) => {
    const t = Math.min(1, (now - start) / dur);
    const eased = 1 - Math.pow(1 - t, 3);
    el.textContent = yen(Math.round(from + (to - from) * eased));
    if (t < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function cheerText(p) {
  if (p >= 100) return "目標達成、おめでとう！";
  if (p >= 75) return "ゴールまであと少し！";
  if (p >= 50) return "折り返し地点を越えたよ";
  if (p >= 25) return "コツコツ続けてえらい！";
  if (p > 0) return "いい調子、その調子！";
  return "はじめの一歩、ここから";
}

function jstNowInput() {
  return new Date(Date.now() + 9 * 60 * 60 * 1000).toISOString().slice(0, 16);
}

function yesterdayInput() {
  return new Date(Date.now() + 9 * 60 * 60 * 1000 - 24 * 60 * 60 * 1000).toISOString().slice(0, 16);
}

const STATUS_TEXT = { pending: "承認待ち", approved: "承認済み", rejected: "却下" };

function renderUser(d) {
  show("user");
  renderRequests(d.requests || []);
  $("reqAt").max = jstNowInput();
  if (!$("reqAt").value) $("reqAt").value = yesterdayInput();
  countUp($("total"), shownTotal, d.total);
  $("goal").textContent = yen(d.goal);
  $("remaining").textContent = yen(d.remaining);
  const pct = Math.min(100, (d.total / d.goal) * 100);
  requestAnimationFrame(() => { $("bar").style.width = pct + "%"; });
  document.querySelectorAll(".tick").forEach((m) => {
    m.classList.toggle("on", pct >= parseFloat(m.style.left));
  });
  $("cheer").textContent = cheerText(pct);

  const cells = grid.children;
  for (let i = 0; i < cells.length; i++) {
    const on = i < d.count;
    cells[i].classList.toggle("on", on);
    cells[i].classList.toggle("new", on && i >= shownCount && shownCount > 0);
  }
  $("stampCount").textContent = d.count + " / 300";
  shownTotal = d.total;
  shownCount = d.count;

  const btn = $("saveBtn");
  if (d.remaining === 0) {
    btn.disabled = true;
    btn.textContent = "30,000円 達成";
    $("note").textContent = "おめでとうございます！";
  } else if (d.savedToday) {
    btn.disabled = true;
    btn.textContent = "今日の貯金は完了しました";
    $("note").textContent = "また明日、押してください。";
  } else {
    btn.disabled = false;
    btn.textContent = "今日の100円を貯金する";
    $("note").textContent = "";
  }
}

function renderRequests(list) {
  const ul = $("reqList");
  ul.textContent = "";
  list.forEach((r) => {
    const li = document.createElement("li");
    const box = document.createElement("div");
    box.className = "txt";
    const when = document.createElement("div");
    when.className = "when";
    when.textContent = fmt.format(new Date(r.target_at));
    box.appendChild(when);
    const badge = document.createElement("span");
    badge.className = "badge " + r.status;
    badge.textContent = STATUS_TEXT[r.status] || r.status;
    li.append(box, badge);
    ul.appendChild(li);
  });
}

function renderPending(list) {
  $("pendCount").textContent = list.length ? list.length + "件" : "";
  const ul = $("pending");
  ul.textContent = "";
  if (!list.length) {
    const li = document.createElement("li");
    li.className = "empty";
    li.textContent = "リクエストはありません";
    ul.appendChild(li);
    return;
  }
  list.forEach((r) => {
    const li = document.createElement("li");
    const box = document.createElement("div");
    box.className = "txt";
    const when = document.createElement("div");
    when.className = "when";
    when.textContent = fmt.format(new Date(r.target_at)) + " に100円";
    const who = document.createElement("div");
    who.className = "who";
    who.textContent = r.requested_by;
    box.append(when, who);

    const yes = document.createElement("button");
    yes.className = "del yes";
    yes.type = "button";
    yes.textContent = "承認";
    const no = document.createElement("button");
    no.className = "del";
    no.type = "button";
    no.textContent = "却下";
    yes.addEventListener("click", () => decide(r, "approve", [yes, no]));
    no.addEventListener("click", () => decide(r, "reject", [yes, no]));
    const btns = document.createElement("div");
    btns.className = "btns";
    btns.append(yes, no);

    li.append(box, btns);
    ul.appendChild(li);
  });
}

function renderAdmin(d) {
  show("admin");
  renderPending(d.pending || []);
  $("addAt").max = jstNowInput();
  $("aTotal").textContent = yen(d.total);
  $("aRemaining").textContent = yen(d.remaining);
  $("aCount").textContent = d.records.length + "件";

  const ul = $("records");
  ul.textContent = "";
  if (!d.records.length) {
    const li = document.createElement("li");
    li.className = "empty";
    li.textContent = "まだ記録がありません";
    ul.appendChild(li);
    return;
  }
  d.records.forEach((r) => {
    const li = document.createElement("li");
    const box = document.createElement("div");
    box.className = "txt";
    const when = document.createElement("div");
    when.className = "when";
    when.textContent = fmt.format(new Date(r.saved_at)) + " に100円";
    const who = document.createElement("div");
    who.className = "who";
    who.textContent = r.saved_by;
    box.append(when, who);

    const del = document.createElement("button");
    del.className = "del";
    del.type = "button";
    del.textContent = "削除";
    del.addEventListener("click", () => removeRecord(r, del));

    li.append(box, del);
    ul.appendChild(li);
  });
}

async function load(screen) {
  let wait = Promise.resolve();
  if (screen) {
    show("loading");
    wait = new Promise((r) => setTimeout(r, 500));
  }
  const { status, body } = await api("/api/status");
  await wait;
  if (status === 401) return reauth();
  if (status === 403) return showLogin("このアカウントは許可されていません。");
  if (status !== 200) return showLogin("読み込みに失敗しました。時間をおいて再度お試しください。");
  freshToken = false;
  if (body.role === "admin") renderAdmin(body); else renderUser(body);
}

async function removeRecord(r, button) {
  if (!confirm(fmt.format(new Date(r.saved_at)) + " の記録を削除しますか？")) return;
  button.disabled = true;
  $("adminError").textContent = "";
  const { status } = await api("/api/records/" + r.id, { method: "DELETE" });
  if (status === 401) return reauth();
  if (status !== 200) {
    button.disabled = false;
    $("adminError").textContent = "削除できませんでした。";
    return;
  }
  load();
}

$("saveBtn").addEventListener("click", async () => {
  const btn = $("saveBtn");
  btn.disabled = true;
  $("error").textContent = "";
  const { status } = await api("/api/save", { method: "POST" });
  if (status === 401) return reauth();
  if (status === 409) { load(); return; }
  if (status !== 200) {
    btn.disabled = false;
    $("error").textContent = "記録できませんでした。もう一度押してください。";
    return;
  }
  load();
});

async function decide(r, action, buttons) {
  const label = action === "approve" ? "承認" : "却下";
  if (!confirm(fmt.format(new Date(r.target_at)) + " のリクエストを" + label + "しますか？")) return;
  const msg = $("pendMsg");
  msg.textContent = "";
  buttons.forEach((b) => { b.disabled = true; });
  const { status, body } = await api("/api/requests/" + r.id + "/" + action, { method: "POST" });
  if (status === 401) return reauth();
  if (status === 409) {
    buttons.forEach((b) => { b.disabled = false; });
    msg.textContent = "その日はすでに記録があります。却下してください。";
    return;
  }
  if (status === 400 && body.error === "goal_reached") {
    buttons.forEach((b) => { b.disabled = false; });
    msg.textContent = "目標に達しているので承認できません。";
    return;
  }
  if (status !== 200) {
    buttons.forEach((b) => { b.disabled = false; });
    msg.textContent = "処理できませんでした。";
    return;
  }
  load();
}

$("reqBtn").addEventListener("click", async () => {
  const msg = $("reqMsg");
  const value = $("reqAt").value;
  msg.className = "error";
  msg.textContent = "";
  if (!value) {
    msg.textContent = "日時を選んでください。";
    return;
  }
  if (!confirm(value.replace("T", " ") + " の貯金をリクエストしますか？")) return;
  const btn = $("reqBtn");
  btn.disabled = true;
  const { status, body } = await api("/api/requests", {
    method: "POST",
    body: JSON.stringify({ savedAt: value })
  });
  btn.disabled = false;
  if (status === 401) return reauth();
  const errors = {
    future: "未来の日時は選べません。",
    today: "今日の分は「今日の100円を貯金する」ボタンを押してください。",
    already_saved: "その日はすでに記録があります。",
    already_requested: "その日はすでにリクエスト中です。",
    goal_reached: "目標に達しているのでリクエストできません。",
    invalid_datetime: "日時を正しく選んでください。"
  };
  if (status !== 200) {
    msg.textContent = errors[body.error] || "送信できませんでした。";
    return;
  }
  msg.className = "ok";
  msg.textContent = "リクエストを送信しました。";
  load();
});

$("addAt").value = jstNowInput();

$("addBtn").addEventListener("click", async () => {
  const msg = $("addMsg");
  const value = $("addAt").value;
  msg.className = "error";
  msg.textContent = "";
  if (!value) {
    msg.textContent = "日時を選んでください。";
    return;
  }
  if (!confirm(value.replace("T", " ") + " に100円を追加しますか？")) return;
  const btn = $("addBtn");
  btn.disabled = true;
  const { status, body } = await api("/api/records", {
    method: "POST",
    body: JSON.stringify({ savedAt: value })
  });
  btn.disabled = false;
  if (status === 401) return reauth();
  if (status === 409) { msg.textContent = "その日はすでに記録があります。"; return; }
  if (status === 400 && body.error === "future") { msg.textContent = "未来の日時は追加できません。"; return; }
  if (status === 400 && body.error === "goal_reached") { msg.textContent = "目標に達しているので追加できません。"; return; }
  if (status !== 200) { msg.textContent = "追加できませんでした。"; return; }
  msg.className = "ok";
  msg.textContent = "追加しました。";
  $("addAt").value = jstNowInput();
  load();
});

$("logout").addEventListener("click", () => { shownTotal = 0; shownCount = 0; showLogin(""); });

function onCredential(response) {
  token = response.credential;
  freshToken = true;
  refreshing = false;
  writeToken(token);
  load(true);
}

function initGoogle() {
  if (!window.google || !google.accounts || !google.accounts.id) {
    setTimeout(initGoogle, 100);
    return;
  }
  google.accounts.id.initialize({ client_id: CLIENT_ID, callback: onCredential, auto_select: true, cancel_on_tap_outside: false });
  google.accounts.id.renderButton($("gbtn"), { theme: "outline", size: "large", text: "signin_with", locale: "ja", width: 280 });
  if (token) load(true);
  else {
    show("login");
    google.accounts.id.prompt();
  }
}

initGoogle();
</script>
</body>
</html>
